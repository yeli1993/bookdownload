<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔趣阁 · 在线小说</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c6cff'/%3E%3Cpath d='M9 7h12a2 2 0 0 1 2 2v16l-2.5-1.6L18 25l-2-1.3L14 25l-2.5-1.6L9 25V9a2 2 0 0 1 0 0z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg-0: #0b0d14;
    --bg-1: #11141f;
    --bg-2: #161a2b;
    --card: rgba(28, 32, 51, 0.55);
    --card-brd: rgba(255, 255, 255, 0.07);
    --txt-0: #f3f5ff;
    --txt-1: #aab0ce;
    --txt-2: #6b7196;
    --accent: #7c6cff;
    --accent-2: #b06cff;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
    --grad: linear-gradient(135deg, #7c6cff 0%, #b06cff 100%);
    --shadow: 0 18px 50px -12px rgba(0, 0, 0, 0.6);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--txt-0);
    background:
      radial-gradient(1100px 600px at 12% -8%, rgba(124, 108, 255, 0.18), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(176, 108, 255, 0.14), transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0) 60%);
    background-attachment: fixed;
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.16); }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 60;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    backdrop-filter: blur(14px);
    background: rgba(11, 13, 20, 0.6);
    border-bottom: 1px solid var(--card-brd);
  }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--grad);
    display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(124, 108, 255, 0.5);
  }
  .logo svg { width: 20px; height: 20px; fill: #fff; }
  .brand h1 { font-size: 17px; font-weight: 650; letter-spacing: .3px; }
  .brand small { display: block; font-size: 11px; color: var(--txt-2); font-weight: 400; margin-top: -2px; }
  .top-actions { display: flex; gap: 10px; align-items: center; }
  .badge {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 10px;
    background: var(--grad); color: #fff; font-size: 11px; font-weight: 700;
    display: inline-grid; place-items: center; line-height: 1;
  }

  .btn {
    border: 1px solid var(--card-brd);
    background: rgba(255,255,255,0.04);
    color: var(--txt-0);
    padding: 9px 16px; border-radius: 10px;
    font-size: 13px; cursor: pointer;
    transition: all .18s ease; font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit;
  }
  .btn:hover { background: rgba(255,255,255,0.09); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn-primary {
    background: var(--grad); border: none; color: #fff;
    box-shadow: 0 8px 22px -6px rgba(124, 108, 255, 0.65);
  }
  .btn-primary:hover { filter: brightness(1.08); background: var(--grad); }
  .btn-ghost { background: transparent; }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
  .btn-danger { color: var(--err); border-color: rgba(248,113,113,.3); }
  .btn-danger:hover { background: rgba(248,113,113,.12); }

  /* ---------- 视图切换 ---------- */
  .view { display: none; animation: fadeUp .3s ease both; }
  .view.active { display: block; }
  .view.reader.active { display: flex; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 28px; }

  /* ---------- 首页 ---------- */
  .hero { text-align: center; padding: 18px 0 26px; }
  .hero h2 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .hero h2 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--txt-2); font-size: 13px; margin-top: 6px; }
  .search-box { position: relative; max-width: 660px; margin: 22px auto 0; display: flex; gap: 10px; align-items: center; }
  .source-select {
    flex-shrink: 0; height: 52px; padding: 0 14px;
    font-size: 13px; color: var(--txt-0); cursor: pointer;
    background: var(--card); border: 1px solid var(--card-brd); border-radius: 12px;
    outline: none; backdrop-filter: blur(12px); transition: all .2s; font-family: inherit;
  }
  .source-select:focus { border-color: rgba(124,108,255,.55); }
  .source-select option { background: #161a2b; color: var(--txt-0); }
  .search-field { position: relative; flex: 1; min-width: 0; }
  .search-field input {
    width: 100%; padding: 16px 96px 16px 18px; font-size: 15px;
    color: var(--txt-0); background: var(--card);
    border: 1px solid var(--card-brd); border-radius: 14px;
    outline: none; transition: all .2s;
    backdrop-filter: blur(12px); font-family: inherit;
  }
  .search-field input::placeholder { color: var(--txt-2); }
  .search-field input:focus { border-color: rgba(124,108,255,.55); box-shadow: 0 0 0 4px rgba(124,108,255,.12); }
  .search-field .btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }

  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .chip {
    font-size: 12px; color: var(--txt-1); padding: 6px 12px;
    border-radius: 20px; border: 1px solid var(--card-brd);
    background: rgba(255,255,255,0.03); cursor: pointer; transition: all .18s;
  }
  .chip:hover { color: var(--txt-0); border-color: rgba(124,108,255,.4); }

  /* 最近搜索 */
  .chips.recent { margin-top: 10px; align-items: center; }
  .chips.recent:empty { display: none; }
  .chips-label { font-size: 12px; color: var(--txt-2); margin-right: 2px; }
  .chip.recent-chip { display: inline-flex; align-items: center; gap: 6px; padding-right: 7px; }
  .chip-del {
    border: 0; background: transparent; color: var(--txt-2); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 2px 3px; border-radius: 50%;
    transition: all .15s;
  }
  .chip-del:hover { color: var(--err); background: rgba(248,113,113,.12); }
  .chips-clear {
    font-size: 12px; color: var(--txt-2); background: none; border: 0;
    cursor: pointer; padding: 6px 4px; transition: color .15s;
  }
  .chips-clear:hover { color: var(--txt-0); }

  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 26px 2px 14px; }
  .section-title h3 { font-size: 15px; font-weight: 600; color: var(--txt-1); }
  .section-title .count { font-size: 12px; color: var(--txt-2); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--card-brd);
    border-radius: var(--radius); padding: 16px;
    display: flex; gap: 14px; position: relative; overflow: hidden;
    transition: all .22s cubic-bezier(.2,.7,.3,1); animation: fadeUp .4s ease both;
    backdrop-filter: blur(10px);
  }
  .card::before { content:""; position:absolute; inset:0; background: linear-gradient(135deg, rgba(124,108,255,.08), transparent 50%); opacity:0; transition: opacity .22s; pointer-events:none; }
  .card.clickable { cursor: pointer; }
  .card:hover { transform: translateY(-4px); border-color: rgba(124,108,255,.35); box-shadow: var(--shadow); }
  .card:hover::before { opacity: 1; }
  .cover {
    width: 64px; height: 86px; flex-shrink: 0; border-radius: 8px;
    background: linear-gradient(135deg, #2a2f4a, #1b1e30);
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
    overflow: hidden; display: grid; place-items: center; color: var(--txt-2);
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .ph { font-size: 22px; opacity: .5; font-weight: 700; }
  .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .meta .t { font-size: 15px; font-weight: 600; color: var(--txt-0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .a { font-size: 12px; color: var(--txt-2); margin-top: 2px; }
  .meta .intro { font-size: 12.5px; color: var(--txt-1); margin-top: 6px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .meta .act { margin-top: auto; padding-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

  .empty { text-align: center; color: var(--txt-2); padding: 70px 20px; }
  .empty .big { font-size: 40px; opacity: .35; font-weight: 800; }
  .empty p { margin-top: 10px; font-size: 13px; }

  .skeleton-card { height: 118px; border-radius: var(--radius); background: linear-gradient(100deg, rgba(255,255,255,.03) 30%, rgba(255,255,255,.07) 50%, rgba(255,255,255,.03) 70%); background-size: 200% 100%; animation: shim 1.2s infinite; }

  /* ---------- 详情页 ---------- */
  .detail-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 28px 60px; }
  .back-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .back-row .crumb { font-size: 13px; color: var(--txt-2); }

  .book-head {
    display: flex; gap: 26px; padding: 26px;
    background: var(--card); border: 1px solid var(--card-brd);
    border-radius: var(--radius); backdrop-filter: blur(12px);
  }
  .book-cover {
    width: 132px; height: 180px; flex-shrink: 0; border-radius: 12px;
    overflow: hidden; background: linear-gradient(135deg, #2a2f4a, #1b1e30);
    box-shadow: 0 10px 26px rgba(0,0,0,.45); display: grid; place-items: center;
    color: var(--txt-2); font-size: 44px; font-weight: 800;
  }
  .book-cover img { width: 100%; height: 100%; object-fit: cover; }
  .book-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .book-info h1 { font-size: 26px; font-weight: 700; }
  .book-tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 3px 10px; border-radius: 8px; font-weight: 500;
    background: rgba(255,255,255,.05); border: 1px solid var(--card-brd); color: var(--txt-1); }
  .tag.status { color: var(--ok); background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.25); }
  .book-intro { font-size: 13.5px; color: var(--txt-1); line-height: 1.9; margin-top: 14px;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .book-actions { display: flex; gap: 10px; margin-top: auto; padding-top: 18px; flex-wrap: wrap; }
  .book-actions .btn { padding: 11px 22px; font-size: 14px; }

  .catalog-panel {
    margin-top: 20px; background: var(--card); border: 1px solid var(--card-brd);
    border-radius: var(--radius); backdrop-filter: blur(12px); overflow: hidden;
  }
  .catalog-head { display: flex; align-items: center; gap: 14px; padding: 14px 18px;
    border-bottom: 1px solid var(--card-brd); flex-wrap: wrap; }
  .catalog-head h3 { font-size: 15px; font-weight: 600; }
  .catalog-head .note { font-size: 12px; color: var(--txt-2); }
  .catalog-search { margin-left: auto; position: relative; }
  .catalog-search input {
    width: 220px; padding: 8px 12px; font-size: 13px; color: var(--txt-0);
    background: rgba(255,255,255,.05); border: 1px solid var(--card-brd);
    border-radius: 10px; outline: none; font-family: inherit; transition: all .2s;
  }
  .catalog-search input:focus { border-color: rgba(124,108,255,.55); }
  .catalog-list { max-height: 520px; overflow-y: auto; padding: 10px 12px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 2px 10px; }

  /* 目录加载进度 */
  .cat-progress { grid-column: 1 / -1; padding: 26px 8px 18px; }
  .cat-progress-bar {
    height: 6px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden;
  }
  .cat-progress-bar i {
    display: block; height: 100%; border-radius: 99px;
    background: var(--grad); transition: width .25s ease;
  }
  .cat-progress-text {
    margin-top: 10px; font-size: 12px; color: var(--txt-2); text-align: center;
  }
  .cat-item {
    display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: 8px;
    font-size: 13px; color: var(--txt-1); cursor: pointer; transition: all .15s; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .cat-item:hover { background: rgba(124,108,255,.12); color: var(--txt-0); }
  .cat-item .no { font-size: 11px; color: var(--txt-2); flex-shrink: 0; }
  .cat-item .ti { overflow: hidden; text-overflow: ellipsis; }

  /* ---------- 阅读器 ---------- */
  .reader {
    /* 布局属性只在激活时生效（见上方 .view.reader.active），否则会覆盖 .view{display:none} 而挡住首页 */
    flex-direction: column;
    background: var(--r-bg, #f7f4ef); color: var(--r-fg, #2e2c29);
  }
  .view.reader.active {
    position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column;
  }
  .reader.theme-light { --r-bg:#f7f4ef; --r-fg:#2e2c29; --r-sub:#9a948a; --r-bar:#fff; --r-brd:#e6e1d6; --r-ac:#7c6cff; }
  .reader.theme-sepia { --r-bg:#f5ecd9; --r-fg:#5b4a33; --r-sub:#a28f6e; --r-bar:#efe3cb; --r-brd:#e0d1b0; --r-ac:#8a6a3b; }
  .reader.theme-green { --r-bg:#cbe8d2; --r-fg:#25402c; --r-sub:#6c8a74; --r-bar:#bfe0c7; --r-brd:#a8cfb3; --r-ac:#2e7d4f; }
  .reader.theme-dark { --r-bg:#111318; --r-fg:#9aa4bd; --r-sub:#5c6480; --r-bar:#191c24; --r-brd:#262a36; --r-ac:#7c6cff; }

  .reader-bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: var(--r-bar); border-bottom: 1px solid var(--r-brd); flex-shrink: 0;
  }
  .rb-btn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--r-brd);
    background: transparent; color: var(--r-fg); font-size: 15px; cursor: pointer;
    display: grid; place-items: center; transition: all .15s; font-family: inherit;
  }
  .rb-btn:hover { background: rgba(0,0,0,.05); }
  .rb-title { flex: 1; min-width: 0; text-align: center; }
  .rb-book { font-size: 12px; color: var(--r-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rb-ch { font-size: 14px; font-weight: 600; color: var(--r-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rb-btn.text { width: auto; padding: 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .5px; }

  .reader-progress { height: 3px; background: var(--r-brd); flex-shrink: 0; }
  .reader-progress i { display: block; height: 100%; width: 0; background: var(--r-ac); transition: width .3s ease; }

  .reader-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .reader-content {
    max-width: 720px; margin: 0 auto; padding: 34px 26px 50px;
    font-size: var(--r-fs, 18px); line-height: var(--r-lh, 1.9);
    font-family: var(--r-ff, "Songti SC", "SimSun", serif);
  }
  .reader-content h1 { font-size: 1.35em; text-align: center; margin-bottom: 26px; font-weight: 700; }
  .reader-content p { text-indent: 2em; margin-bottom: .9em; word-break: break-word; }
  .reader-loading { text-align: center; color: var(--r-sub); padding: 80px 0; }
  .reader-err { text-align: center; color: var(--r-sub); padding: 80px 0; }
  .reader-err .btn { margin-top: 16px; color: var(--r-fg); border-color: var(--r-brd); }

  .reader-nav {
    display: flex; gap: 12px; justify-content: center; padding: 14px 16px 22px;
    background: var(--r-bar); border-top: 1px solid var(--r-brd); flex-shrink: 0;
  }
  .reader-nav .btn {
    min-width: 130px; justify-content: center; color: var(--r-fg);
    border: 1px solid var(--r-brd); background: transparent;
  }
  .reader-nav .btn:hover { background: rgba(0,0,0,.05); transform: none; }
  .reader-nav .btn.btn-primary { background: var(--r-ac); border: none; color: #fff; }
  .reader-nav .btn:disabled { opacity: .35; }

  /* ---------- 抽屉 ---------- */
  .drawer-mask {
    position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.45);
    opacity: 0; visibility: hidden; transition: all .25s ease;
  }
  .drawer-mask.open { opacity: 1; visibility: visible; }
  .drawer {
    position: fixed; top: 0; bottom: 0; z-index: 90; width: 360px; max-width: 88vw;
    background: var(--bg-2, #161a2b); color: var(--txt-0);
    display: flex; flex-direction: column;
    transition: transform .28s cubic-bezier(.2,.7,.3,1);
    box-shadow: var(--shadow);
  }
  .drawer.left { left: 0; transform: translateX(-102%); }
  .drawer.left.open { transform: translateX(0); }
  .drawer.right { right: 0; transform: translateX(102%); }
  .drawer.right.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; gap: 12px; padding: 16px 18px;
    border-bottom: 1px solid var(--card-brd); flex-shrink: 0;
  }
  .drawer-head h3 { font-size: 15px; font-weight: 600; }
  .drawer-head input {
    flex: 1; padding: 8px 12px; font-size: 13px; color: var(--txt-0);
    background: rgba(255,255,255,.05); border: 1px solid var(--card-brd);
    border-radius: 10px; outline: none; font-family: inherit;
  }
  .drawer-body { flex: 1; overflow-y: auto; padding: 12px; }
  .drawer-close { margin-left: auto; cursor: pointer; color: var(--txt-2); font-size: 18px; background: none; border: none; }

  /* 阅读器目录（浅色系） */
  .drawer.chapter { background: var(--r-bar, #fff); color: var(--r-fg, #2e2c29); }
  .drawer.chapter .drawer-head { border-color: var(--r-brd, #e6e1d6); }
  .drawer.chapter .drawer-head input {
    background: rgba(0,0,0,.05); border-color: var(--r-brd, #e6e1d6); color: var(--r-fg);
  }
  .drawer.chapter .drawer-close { color: var(--r-sub); }
  .reader-cat { display: flex; flex-direction: column; gap: 2px; }
  .reader-cat .rc {
    padding: 8px 12px; border-radius: 8px; font-size: 13px; color: var(--r-fg);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: all .12s;
  }
  .reader-cat .rc:hover { background: rgba(0,0,0,.06); }
  .reader-cat .rc.cur { background: var(--r-ac); color: #fff; font-weight: 600; }
  .reader-cat .rc.miss { color: var(--r-sub); cursor: default; }

  /* 阅读设置 */
  .set-group { margin-bottom: 22px; }
  .set-group > label { display: block; font-size: 12px; color: var(--txt-2); margin-bottom: 10px; letter-spacing: .5px; }
  .set-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .set-opt {
    padding: 7px 14px; border-radius: 9px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--card-brd); background: rgba(255,255,255,.04); color: var(--txt-1);
    transition: all .15s; font-family: inherit;
  }
  .set-opt:hover { color: var(--txt-0); }
  .set-opt.on { background: var(--grad); color: #fff; border-color: transparent; }
  .set-opt.song { font-family: "Songti SC", "SimSun", serif; }
  .set-opt.hei { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  .set-opt.kai { font-family: "KaiTi", "STKaiti", serif; }
  .size-bar { display: flex; align-items: center; gap: 10px; width: 100%; }
  .size-bar input[type=range] { flex: 1; accent-color: var(--accent); }
  .size-val { font-size: 13px; color: var(--txt-1); min-width: 42px; text-align: center; }

  /* ---------- 下载任务抽屉 ---------- */
  .task-list { display: flex; flex-direction: column; gap: 12px; }
  .task {
    background: rgba(255,255,255,0.03); border: 1px solid var(--card-brd);
    border-radius: 12px; padding: 12px; animation: fadeUp .35s ease both;
  }
  .task .tt { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task .ss { font-size: 11px; color: var(--txt-2); margin-top: 2px; }
  .bar { height: 8px; border-radius: 6px; background: rgba(255,255,255,.06); margin: 10px 0 6px; overflow: hidden; position: relative; }
  .bar > i { display: block; height: 100%; background: var(--grad); border-radius: 6px; width: 0; transition: width .25s ease; position: relative; }
  .bar.run > i::after { content:""; position:absolute; inset:0; background: linear-gradient(45deg, rgba(255,255,255,.18) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.18) 50%, rgba(255,255,255,.18) 75%, transparent 75%); background-size: 16px 16px; animation: stripe 0.8s linear infinite; }
  .task .stat { display: flex; justify-content: space-between; font-size: 11px; color: var(--txt-2); }
  .task .ops { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .t-tag { font-size: 10.5px; padding: 2px 8px; border-radius: 8px; font-weight: 600; }
  .t-tag.run { color: var(--accent); background: rgba(124,108,255,.14); }
  .t-tag.done { color: var(--ok); background: rgba(52,211,153,.12); }
  .t-tag.err { color: var(--err); background: rgba(248,113,113,.12); }
  .t-tag.cxl { color: var(--txt-2); background: rgba(255,255,255,.05); }
  .tasks-empty { text-align: center; color: var(--txt-2); padding: 50px 10px; font-size: 13px; }

  /* ---------- toast ---------- */
  .toasts { position: fixed; right: 20px; bottom: 20px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    background: rgba(20, 24, 38, 0.92); border: 1px solid var(--card-brd);
    color: var(--txt-0); padding: 12px 16px; border-radius: 12px;
    font-size: 13px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
    animation: toastIn .3s ease; min-width: 220px; border-left: 3px solid var(--accent);
  }
  .toast.ok { border-left-color: var(--ok); }
  .toast.err { border-left-color: var(--err); }

  .foot { text-align: center; color: var(--txt-2); font-size: 11px; padding: 24px; }

  .spin { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,.12); border-top-color: currentColor; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes shim { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes stripe { 0% { background-position: 0 0; } 100% { background-position: 16px 0; } }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 720px) {
    .topbar { padding: 12px 16px; }
    .wrap { padding: 18px; }
    .book-head { flex-direction: column; align-items: center; text-align: center; }

    .catalog-list { grid-template-columns: 1fr 1fr; }
    .search-box { flex-wrap: wrap; }
    .source-select { height: 46px; }
  }
</style>

<script>
const API = location.origin;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const state = {
  view: 'home',
  bookUrl: '',      // 当前书籍标识（bq5 链接 或 main:<id>）
  source: 'bq5',    // 当前阅读来源：bq5 | main
  book: null,       // 详情
  reading: [],      // 阅读目录
  curIdx: -1,       // 当前章节在 reading 中的下标
  prevTail: null,   // 上一章结尾段落（用于章节边界去重）
  prevTailIdx: -1,  // prevTail 对应的章节下标
  tasks: new Map(),
  sse: new Map(),
};

// 阅读设置
const SET_KEY = 'reader:settings';
const FONT_FAMILIES = { song: '"Songti SC","SimSun",serif', hei: '"Microsoft YaHei","PingFang SC",sans-serif', kai: '"KaiTi","STKaiti",serif' };
let settings = { fs: 18, lh: 1.9, ff: 'song', theme: 'light' };

// ---- 工具 ----
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; setTimeout(() => el.remove(), 300); }, 3200);
}
const esc = s => (s == null ? '' : String(s)).replace(/[<>&"]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));

function showView(name) {
  state.view = name;
  ['viewHome', 'viewDetail', 'viewReader'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('active', id === 'viewHome' && name === 'home' || id === 'viewDetail' && name === 'detail' || id === 'viewReader' && name === 'reader');
  });
  if (name !== 'reader') { closeDrawers(); document.body.style.overflow = ''; }
  if (name === 'reader') document.body.style.overflow = 'hidden';
  else document.body.style.overflow = '';
  window.scrollTo(0, 0);
}

// ---- 抽屉 ----
function openDrawer(id) {
  document.getElementById(id).classList.add('open');
  $('#drawerMask').classList.add('open');
}
function closeDrawers() {
  $$('.drawer').forEach(d => d.classList.remove('open'));
  $('#drawerMask').classList.remove('open');
}

// ---- 首页：最近搜索（localStorage 持久化，支持单条删除/全部清空） ----
const RECENT_KEY = 'recent:searches';
const RECENT_MAX = 10;
function loadRecent() {
  try { const l = JSON.parse(localStorage.getItem(RECENT_KEY)); return Array.isArray(l) ? l : []; } catch { return []; }
}
function saveRecent(list) {
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, RECENT_MAX))); } catch {}
}
function addRecent(kw) {
  kw = String(kw || '').trim();
  if (!kw) return;
  const list = loadRecent().filter(x => x !== kw);
  list.unshift(kw);
  saveRecent(list);
  renderRecent();
}
function removeRecent(kw) {
  saveRecent(loadRecent().filter(x => x !== kw));
  renderRecent();
}
function clearRecent() {
  saveRecent([]);
  renderRecent();
}
function renderRecent() {
  const box = $('#recentBox');
  if (!box) return;
  const list = loadRecent();
  if (!list.length) { box.innerHTML = ''; box.style.display = 'none'; return; }
  box.style.display = 'flex';
  box.innerHTML = '<span class="chips-label">最近搜索</span>' +
    list.map(w => `<span class="chip recent-chip" data-kw="${esc(w)}">${esc(w)}<button class="chip-del" data-del="${esc(w)}" title="删除这条记录">×</button></span>`).join('') +
    '<button class="chips-clear" id="clearRecent">清空</button>';
}

// ---- 首页：搜索 ----
async function doSearch(kw) {
  const results = $('#results');
  addRecent(kw);
  $('#resTitle').textContent = '搜索中…';
  $('#resCount').textContent = '';
  results.innerHTML = Array.from({length:6}).map(() => '<div class="skeleton-card"></div>').join('');
  const source = $('#source').value;
  const api = source === 'biquge5' ? `${API}/api/search/bq5` : `${API}/api/search`;
  try {
    const r = await fetch(`${api}?q=${encodeURIComponent(kw)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '搜索失败');
    renderResults(d.data || [], `“${kw}” 的搜索结果`, source);
  } catch (e) {
    results.innerHTML = `<div class="empty"><div class="big">!</div><p>${esc(e.message)}</p></div>`;
    $('#resTitle').textContent = '搜索失败';
  }
}

function renderResults(list, title, source = 'bqg713') {
  const results = $('#results');
  $('#resTitle').textContent = title || '搜索结果';
  $('#resCount').textContent = list.length ? `${list.length} 本` : '';
  if (!list.length) {
    results.innerHTML = '<div class="empty"><div class="big">∅</div><p>没有找到相关书籍</p></div>';
    return;
  }
  const isBq5 = source === 'biquge5';
  results.innerHTML = list.map((b, i) => {
    const cover = isBq5 ? (b.cover || '') : coverUrl(b.id);
    const sub = isBq5
      ? `${esc(b.author || '')} · ${esc(b.status || '')}`
      : `${esc(b.author || '')} · ID ${esc(b.id || '')}`;
    const ph = esc((b.title || '书')[0]);
    const readBtn = isBq5
      ? `<button class="btn btn-primary btn-sm" data-action="read" data-url="${esc(b.url)}" data-title="${esc(b.title)}">在线阅读</button>`
      : `<button class="btn btn-sm" data-action="read" data-kw="${esc(b.title)}" data-id="${Number(b.id)}" data-source="bqg713">在线阅读</button>`;
    const dlBtn = isBq5
      ? `<button class="btn btn-sm" data-action="download" data-source="bq5" data-url="${esc(b.url)}" data-title="${esc(b.title)}">下载全本</button>`
      : `<button class="btn btn-sm" data-action="download" data-source="bqg713" data-id="${Number(b.id)}" data-title="${esc(b.title)}">下载全本</button>`;
    return `
    <div class="card ${isBq5 ? 'clickable' : ''}" ${isBq5 ? `data-action="open" data-url="${esc(b.url)}" data-title="${esc(b.title)}"` : ''} style="animation-delay:${i * 0.04}s">
      <div class="cover">${cover ? `<img loading="lazy" src="${cover}" onerror="this.parentNode.innerHTML='<span class=&quot;ph&quot;>${ph}</span>'">` : `<span class="ph">${ph}</span>`}</div>
      <div class="meta">
        <div class="t" title="${esc(b.title)}">${esc(b.title)}</div>
        <div class="a">${sub}</div>
        <div class="intro">${esc(b.intro || '暂无简介')}</div>
        <div class="act">${readBtn}${dlBtn}</div>
      </div>
    </div>`;
  }).join('');
}

// bqg713 书籍优先换源到笔趣阁5阅读（源更干净）；笔趣阁5没有时回退主源直接阅读
async function openDetailByTitle(kw, id) {
  if (!kw) return;
  toast('正在笔趣阁5中查找《' + kw + '》…');
  try {
    const r = await fetch(`${API}/api/search/bq5?q=${encodeURIComponent(kw)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    const list = d.data || [];
    // 书名必须与关键词完全一致（防止《兽血沸腾2》抢占《兽血沸腾》）；其次回退到包含匹配
    const hit = list.find(b => (b.title || '').trim() === kw)
      || list.find(b => b.title && b.title.indexOf(kw) !== -1)
      || list[0];
    if (hit) { openDetail(hit.url, hit.title); return; }
    // 笔趣阁5 无此书 → 回退主源阅读
    if (id) { toast('笔趣阁5 未收录，改用主源阅读', ''); openDetailMain(id); return; }
    toast('该书籍在笔趣阁5未找到，可切换搜索源后重试', 'err');
  } catch (e) {
    // 换源接口异常时同样回退主源
    if (id) { toast('换源失败，改用主源阅读', ''); openDetailMain(id); return; }
    toast('换源查找失败：' + e.message, 'err');
  }
}

// ---- 详情页 ----
// 两阶段加载：先取书籍信息（~0.5s 出画面），再取完整目录（大书 1~3s）
// 目录加载期间显示真实进度条，避免"转圈白等"
async function openDetail(url, title) {
  state.bookUrl = url;
  state.source = 'bq5';
  showView('detail');
  $('#detailCrumb').textContent = title || '';
  $('#detailBody').innerHTML = '<div class="empty"><div class="spin" style="margin:0 auto"></div><p>正在加载书籍信息…</p></div>';

  // 阶段 1：书籍信息（快）
  let info = null;
  try {
    const r = await fetch(`${API}/api/book/bq5?stage=info&url=${encodeURIComponent(url)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '加载失败');
    info = d;
    state.book = { ...d, reading: [], missing: [] };
    state.reading = [];
    renderDetailSkeleton(info);
  } catch (e) {
    $('#detailBody').innerHTML = `<div class="empty"><div class="big">!</div><p>${esc(e.message)}</p></div>`;
    return;
  }

  // 阶段 2：完整目录（带进度反馈）
  const t0 = Date.now();
  const pages = info.totalPages || 1;
  startCatalogProgress(pages);
  try {
    const r = await fetch(`${API}/api/book/bq5?url=${encodeURIComponent(url)}`);
    const book = await r.json();
    if (!r.ok) throw new Error(book.error || '加载失败');
    state.book = book;
    state.reading = book.reading || [];
    renderDetail(book);
    const sec = ((Date.now() - t0) / 1000).toFixed(1);
    if (state.reading.length > 800) toast(`目录已就绪：${state.reading.length} 章（${sec}s）`, 'ok');
  } catch (e) {
    stopCatalogProgress();
    $('#detailCatalog') && ($('#detailCatalog').innerHTML =
      `<div class="empty" style="padding:24px 0"><p>目录加载失败：${esc(e.message)}</p>
       <button class="btn btn-sm" id="retryCatalog" style="margin-top:10px">重试</button></div>`);
    const btn = $('#retryCatalog');
    if (btn) btn.addEventListener('click', () => openDetail(url, title));
  }
}

// 目录加载中的进度条（按页数估算，2.5s 内匀速推进到 90%，完成后由真实结果补齐）
let _catTimer = null;
function startCatalogProgress(pages) {
  const box = $('#detailCatalog');
  if (!box) return;
  const estimate = Math.min(95, Math.max(25, pages * 8));
  box.innerHTML = `<div class="cat-progress">
      <div class="cat-progress-bar"><i id="catBar" style="width:6%"></i></div>
      <div class="cat-progress-text" id="catPct">正在抓取目录…（共 ${pages} 页，约 ${pages * 100} 章）</div>
    </div>`;
  let pct = 6;
  const step = () => {
    pct = Math.min(estimate, pct + Math.max(1, estimate / 22));
    const bar = $('#catBar'), txt = $('#catPct');
    if (!bar) { clearInterval(_catTimer); _catTimer = null; return; }
    bar.style.width = pct.toFixed(0) + '%';
    if (txt) txt.textContent = `正在抓取目录… ${pct.toFixed(0)}%（共 ${pages} 页）`;
  };
  clearInterval(_catTimer);
  _catTimer = setInterval(step, 120);
}
function stopCatalogProgress() {
  clearInterval(_catTimer);
  _catTimer = null;
}

// 主源（bqg713）详情页：笔趣阁5 无此书时使用
async function openDetailMain(id) {
  state.bookUrl = 'main:' + id;
  state.source = 'main';
  showView('detail');
  $('#detailCrumb').textContent = '加载中…';
  $('#detailBody').innerHTML = '<div class="empty"><div class="spin" style="margin:0 auto"></div><p>正在加载书籍信息…</p></div>';
  try {
    const r = await fetch(`${API}/api/catalog/${id}`);
    const book = await r.json();
    if (!r.ok) throw new Error(book.error || '加载失败');
    state.book = book;
    state.reading = book.reading || [];
    state.bookUrl = 'main:' + id;
    $('#detailCrumb').textContent = book.title || '';
    renderDetail(book);
  } catch (e) {
    $('#detailBody').innerHTML = `<div class="empty"><div class="big">!</div><p>${esc(e.message)}</p></div>`;
  }
}

function renderDetail(book) {
  const saved = loadProgress(state.bookUrl || book.url);
  const ph = esc((book.title || '书')[0]);
  const missingNote = book.missing && book.missing.length
    ? `<span class="tag">源站缺失 ${book.missing.length} 章</span>` : '';
  const cont = saved && saved.idx >= 0 && saved.idx < state.reading.length
    ? `<button class="btn btn-primary" data-action="resume">继续阅读 · ${esc(state.reading[saved.idx].title.slice(0, 22))}</button>`
    : `<button class="btn btn-primary" data-action="start">开始阅读</button>`;

// 目录渲染：大书（2500+ 章）一次性插入会卡住数秒。
// 策略：先渲染前 300 条立即出画面；滚动到接近底部时自动追加下一批（每次 300 条）。
// 搜索时全量匹配（结果集通常很小）。
const CAT_CHUNK = 300;
let _catRenderToken = 0;
let _catItems = [];       // 当前待渲染全集
let _catShown = 0;        // 已渲染条数
let _catContainer = null;

function catItemHtml(c) {
  const missing = !!c.missing;
  const url = c.hrefs ? c.hrefs.join(',') : '';
  return `<div class="cat-item" data-idx="${state.reading.indexOf(c)}" data-url="${esc(url)}">
    <span class="no">${c.num}</span><span class="ti">${esc(c.title)}${missing ? '（缺失）' : ''}</span></div>`;
}

function renderCatalog(list, container, kw = '') {
  if (!container) return;
  const token = ++_catRenderToken;
  const items = kw
    ? list.filter(c => c.title.indexOf(kw) !== -1 || String(c.num) === kw)
    : list;

  // 搜索/小列表：一次渲染完
  if (kw || items.length <= CAT_CHUNK) {
    container.innerHTML = items.map(catItemHtml).join('');
    _catItems = []; _catShown = 0; _catContainer = null;
    return;
  }

  // 大列表：首批 + 滚动追加
  _catItems = items;
  _catShown = 0;
  _catContainer = container;
  container.innerHTML = '';
  const appendChunk = () => {
    if (token !== _catRenderToken || !_catContainer) return;
    const end = Math.min(_catShown + CAT_CHUNK, _catItems.length);
    const frag = document.createElement('div');
    frag.innerHTML = _catItems.slice(_catShown, end).map(catItemHtml).join('');
    while (frag.firstChild) _catContainer.appendChild(frag.firstChild);
    _catShown = end;
  };
  appendChunk();
  // 剩余部分在滚动接近底部时追加（避免 rAF 在后台标签页被节流导致渲染停滞）
  container.onscroll = () => {
    if (token !== _catRenderToken) return;
    if (_catShown >= _catItems.length) { container.onscroll = null; return; }
    if (container.scrollTop + container.clientHeight >= container.scrollHeight - 200) {
      appendChunk();
    }
  };
}

// ---- 阅读器 ----
function saveProgress(idx) {
  try {
    localStorage.setItem('read:' + state.bookUrl, JSON.stringify({
      idx, title: (state.reading[idx] || {}).title || '', top: 0, t: Date.now(),
    }));
  } catch {}
}
function loadProgress(url) {
  try { return JSON.parse(localStorage.getItem('read:' + url)) || null; } catch { return null; }
}

function openReader(idx) {
  if (!state.reading.length) return;
  idx = Math.max(0, Math.min(state.reading.length - 1, idx));
  // 仅顺序翻页时保留上一章结尾用于边界去重；跳转/回到上次进度时清空
  if (idx !== state.prevTailIdx + 1) { state.prevTail = null; state.prevTailIdx = -1; }
  state.curIdx = idx;
  showView('reader');
  renderReaderShell();
  loadChapter(idx);
  saveProgress(idx);
}

function renderReaderShell() {
  const ch = state.reading[state.curIdx];
  $('#rbBook').textContent = state.book ? state.book.title : '';
  $('#rbCh').textContent = ch ? ch.title : '';
  $('#readerProg').style.width = ((state.curIdx + 1) / state.reading.length * 100) + '%';
  $('#rbPrev').disabled = state.curIdx <= 0;
  $('#rbNext').disabled = state.curIdx >= state.reading.length - 1;
}

// 章节加载竞态守卫：只接受最新一次请求的结果（防止快速翻页时旧请求覆盖新章）
let _chapterReq = 0;

async function loadChapter(idx) {
  const ch = state.reading[idx];
  if (!ch) return;
  const req = ++_chapterReq;
  renderReaderShell();
  const box = $('#readerContent');
  box.innerHTML = `<div class="reader-loading"><span class="spin"></span><p style="margin-top:12px">正在加载：${esc(ch.title)}</p></div>`;
  $('#readerScroll').scrollTop = 0;
  try {
    const url = state.source === 'main'
      ? `${API}/api/chapter/${state.book.id}/${ch.chapterid}`
      : `${API}/api/chapter/bq5?url=${encodeURIComponent(ch.hrefs.join(','))}`;
    const r = await fetch(url);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '加载失败');
    if (d.error) throw new Error(d.error);
    if (req !== _chapterReq) return; // 用户已翻到别章，丢弃过期结果
    // 章节标题：去掉源站拼接的 "-《书名》" 尾巴
    const title = (d.title || ch.title || '').replace(/-《[^》]*》\s*$/, '').trim() || ch.title;
    let paras = (d.txt || '').split(/\n+/).filter(Boolean);
    // 章节边界去重：顺序翻页时，去掉与上一章结尾重复的段落（源站章节切分会重叠数段）
    if (state.prevTail && state.prevTail.length && idx === state.prevTailIdx + 1) {
      const max = Math.min(4, state.prevTail.length, paras.length);
      let cut = 0;
      for (let k = 0; k < max; k++) if (state.prevTail[k] === paras[k]) cut = k + 1; else break;
      if (cut) paras = paras.slice(cut);
    }
    box.innerHTML = `<h1>${esc(title)}</h1>` + paras.map(p => `<p>${esc(p)}</p>`).join('');
    // 记录本章结尾段落，供下一章边界去重
    state.prevTail = paras.slice(-3);
    state.prevTailIdx = idx;
    // 恢复到上次阅读位置
    const saved = loadProgress(state.bookUrl);
    if (saved && saved.idx === idx && saved.top > 0) {
      $('#readerScroll').scrollTop = saved.top;
    } else {
      $('#readerScroll').scrollTop = 0;
    }
    // 预热下一章（后台缓存，翻页更顺滑）
    if (idx + 1 < state.reading.length) {
      const nxt = state.reading[idx + 1];
      const nurl = state.source === 'main'
        ? `${API}/api/chapter/${state.book.id}/${nxt.chapterid}`
        : `${API}/api/chapter/bq5?url=${encodeURIComponent(nxt.hrefs.join(','))}`;
      fetch(nurl).catch(() => {});
    }
  } catch (e) {
    if (req !== _chapterReq) return;
    box.innerHTML = `<div class="reader-err"><div>加载失败：${esc(e.message)}</div><button class="btn" id="retryCh">重试</button></div>`;
    $('#retryCh').addEventListener('click', () => loadChapter(idx));
  }
}

function goChapter(delta) {
  const idx = state.curIdx + delta;
  if (idx < 0 || idx >= state.reading.length) return;
  openReader(idx);
}

// 阅读进度记忆（滚动节流）
let _scrollTimer = 0;
$('#readerScroll').addEventListener('scroll', () => {
  if (state.view !== 'reader') return;
  clearTimeout(_scrollTimer);
  _scrollTimer = setTimeout(() => {
    try {
      const p = JSON.parse(localStorage.getItem('read:' + state.bookUrl) || '{}');
      p.idx = state.curIdx; p.top = $('#readerScroll').scrollTop;
      localStorage.setItem('read:' + state.bookUrl, JSON.stringify(p));
    } catch {}
  }, 400);
});

// ---- 下载任务 ----
async function startDownload(id, title) {
  [...state.tasks.keys()].forEach(tid => rmTask(tid));
  toast(`开始下载：${title || id}`);
  const tmpId = 'pending_' + Date.now();
  state.tasks.set(tmpId, { taskId: tmpId, bookId: String(id), title: title || String(id), author: '', total: 0, to: 0, done: 0, pct: 0, status: 'pending', speed: 0, eta: 0, failedCount: 0, fileName: '' });
  renderTask(state.tasks.get(tmpId));
  openDrawer('tasksDrawer');
  try {
    const r = await fetch(`${API}/api/download`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, concurrency: 6 })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '启动失败');
    rmTask(tmpId);
    state.tasks.set(d.taskId, { taskId: d.taskId, bookId: String(id), title: title || String(id), author: '', total: 0, to: 0, done: 0, pct: 0, status: 'pending', speed: 0, eta: 0, failedCount: 0, fileName: '' });
    renderTask(state.tasks.get(d.taskId));
    connectSSE(d.taskId);
  } catch (e) {
    rmTask(tmpId);
    toast('下载失败：' + e.message, 'err');
  }
}

async function startBq5Download(url, title) {
  [...state.tasks.keys()].forEach(tid => rmTask(tid));
  toast(`开始下载（笔趣阁5）：${title || url}`);
  const tmpId = 'pending_' + Date.now();
  state.tasks.set(tmpId, { taskId: tmpId, bookId: url, title: title || '正在解析…', author: '', total: 0, to: 0, done: 0, pct: 0, status: 'pending', speed: 0, eta: 0, failedCount: 0, missingCount: 0, fileName: '' });
  renderTask(state.tasks.get(tmpId));
  openDrawer('tasksDrawer');
  try {
    const r = await fetch(`${API}/api/download/bq5`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, concurrency: 4 })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '启动失败');
    rmTask(tmpId);
    state.tasks.set(d.taskId, { taskId: d.taskId, bookId: url, title: title || '正在解析…', author: '', total: 0, to: 0, done: 0, pct: 0, status: 'pending', speed: 0, eta: 0, failedCount: 0, missingCount: 0, fileName: '' });
    renderTask(state.tasks.get(d.taskId));
    connectSSE(d.taskId);
  } catch (e) {
    rmTask(tmpId);
    toast('下载失败：' + e.message, 'err');
  }
}

function connectSSE(taskId) {
  if (state.sse.get(taskId)) return;
  const es = new EventSource(`${API}/api/progress/${taskId}`);
  state.sse.set(taskId, es);
  es.onmessage = (ev) => {
    const s = JSON.parse(ev.data);
    state.tasks.set(taskId, s);
    renderTask(s);
    if (['done','error','cancelled'].includes(s.status)) {
      setTimeout(() => { es.close(); state.sse.delete(taskId); }, 800);
      if (s.status === 'done') toast(`下载完成：${s.title}`, 'ok');
      if (s.status === 'error') toast(`出错：${s.error}`, 'err');
    }
  };
  es.onerror = () => {
    const s = state.tasks.get(taskId);
    if (s && ['done', 'error', 'cancelled'].includes(s.status)) { es.close(); state.sse.delete(taskId); }
  };
}

function renderTask(s) {
  const list = $('#taskList');
  $('#taskEmpty').style.display = state.tasks.size ? 'none' : '';
  $('#taskBadge').textContent = state.tasks.size;
  let el = $(`#task-${s.taskId}`);
  const html = taskHtml(s);
  if (el) { el.innerHTML = html; }
  else { list.insertAdjacentHTML('afterbegin', `<div id="task-${s.taskId}" class="task">${html}</div>`); }
}
function taskHtml(s) {
  const tag = { running:['run','运行中'], done:['done','已完成'], error:['err','失败'], cancelled:['cxl','已取消'], pending:['run','等待中'] }[s.status] || ['run', s.status];
  const done = s.status === 'done';
  const canStop = s.status === 'running' || s.status === 'pending';
  return `
    <div class="tt" title="${esc(s.title)}">${esc(s.title || s.bookId)}</div>
    <div class="ss">${esc(s.author||'')} · 共 ${s.total} 章 · ${s.fileName||'—'}</div>
    <div class="bar ${s.status==='running'?'run':''}"><i style="width:${s.pct}%"></i></div>
    <div class="stat">
      <span><span class="t-tag ${tag[0]}">${tag[1]}</span> ${s.done}/${s.total}</span>
      <span>${s.pct}% ${s.status==='running' ? `· ${s.speed}章/s · ETA ${s.eta}s` : ''}</span>
    </div>
    ${s.failedCount ? `<div class="ss" style="color:var(--warn)">⚠ ${s.failedCount} 章失败，可重新下载续传</div>`:''}
    ${s.missingCount ? `<div class="ss" style="color:var(--warn)">⚠ 源站缺失章节：${esc((s.missing||[]).join('、'))}</div>`:''}
    <div class="ops">
      ${done && s.fileName ? `<a class="btn btn-sm btn-primary" href="${API}/api/file/${s.taskId}" download>保存文件</a>` : ''}
      ${canStop ? `<button class="btn btn-sm btn-danger" data-action="cancel" data-tid="${s.taskId}">取消</button>` : ''}
      <button class="btn btn-sm btn-ghost" data-action="rmtask" data-tid="${s.taskId}">移除</button>
    </div>`;
}
async function cancelTask(tid) {
  await fetch(`${API}/api/cancel/${tid}`, { method: 'POST' });
}
function rmTask(tid) {
  const el = $(`#task-${tid}`); if (el) el.remove();
  state.tasks.delete(tid);
  $('#taskEmpty').style.display = state.tasks.size ? 'none' : '';
  $('#taskBadge').textContent = state.tasks.size;
}

// ---- 初始化 ----
function init() {
  loadSettings();

  // 首页搜索
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') triggerSearch(); });
  $('#searchBtn').addEventListener('click', triggerSearch);
  $('#chips').addEventListener('click', e => {
    if (e.target.classList.contains('chip')) { $('#q').value = e.target.dataset.kw; triggerSearch(); }
  });

  // 最近搜索：点击词条重新搜索；× 删除单条；清空全部
  renderRecent();
  $('#recentBox').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) { e.stopPropagation(); removeRecent(del.dataset.del); return; }
    if (e.target.closest('#clearRecent')) { clearRecent(); return; }
    const chip = e.target.closest('.chip');
    if (chip && chip.dataset.kw) { $('#q').value = chip.dataset.kw; triggerSearch(); }
  });

  // 首页结果事件委托
  $('#results').addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    if (action === 'download') {
      if (el.dataset.source === 'bq5') startBq5Download(el.dataset.url, el.dataset.title);
      else startDownload(el.dataset.id, el.dataset.title);
      return;
    }
    if (action === 'read') {
      if (el.dataset.source === 'bqg713') openDetailByTitle(el.dataset.kw, el.dataset.id);
      else openDetail(el.dataset.url, el.dataset.title);
      return;
    }
    if (action === 'open') openDetail(el.dataset.url, el.dataset.title);
  });

  // 详情页事件委托（含动态目录，容器 #detailBody 静态存在）
  $('#detailBody').addEventListener('click', e => {
    const item = e.target.closest('.cat-item');
    if (item) {
      const c = state.reading[Number(item.dataset.idx)];
      if (c && c.missing) return;   // 源站确实没有该章
      openReader(Number(item.dataset.idx));
      return;
    }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    if (action === 'start') openReader(0);
    if (action === 'resume') {
      const saved = loadProgress(state.bookUrl);
      openReader(saved && saved.idx >= 0 ? saved.idx : 0);
    }
    if (action === 'download') {
      if (el.dataset.source === 'bq5') startBq5Download(el.dataset.url, el.dataset.title);
      else startDownload(el.dataset.id, el.dataset.title);
    }
  });

  // 返回
  $$('[data-back]').forEach(b => b.addEventListener('click', () => showView(b.dataset.back)));
  $('#goHome').addEventListener('click', () => { showView('home'); });

  // 阅读器控制
  $('#rbBack').addEventListener('click', () => {
    // 主源书籍（bookUrl = main:<id>）走主源详情页，bq5 书籍走换源详情页
    if (state.source === 'main' && state.book && state.book.id) {
      openDetailMain(state.book.id);
    } else if (state.bookUrl) {
      openDetail(state.bookUrl, state.book ? state.book.title : '');
    }
  });
  $('#rbPrev').addEventListener('click', () => goChapter(-1));
  $('#rbNext').addEventListener('click', () => goChapter(1));
  $('#rbCatalog').addEventListener('click', openReaderCatalog);
  $('#rbSettings').addEventListener('click', () => { applySettings(); openDrawer('settingsDrawer'); });
  $('#catFilter').addEventListener('input', e => applyCatFilter(e.target.value.trim()));
  $('#catalogList').addEventListener('click', e => {
    const el = e.target.closest('.rc');
    if (!el) return;
    // 主源章节没有 hrefs（用 chapterid），bq5 章节带 data-url
    if (state.source !== 'main' && !el.dataset.url) return;
    openReader(Number(el.dataset.idx));
    closeDrawers();
  });

  // 阅读设置交互
  $('#fsMinus').addEventListener('click', () => { settings.fs = Math.max(14, settings.fs - 1); saveSettings(); applySettings(); });
  $('#fsPlus').addEventListener('click', () => { settings.fs = Math.min(28, settings.fs + 1); saveSettings(); applySettings(); });
  $('#fsRange').addEventListener('input', e => { settings.fs = Number(e.target.value); saveSettings(); applySettings(); });
  $('#settingsDrawer').addEventListener('click', e => {
    const b = e.target.closest('[data-lh],[data-ff],[data-theme]');
    if (!b) return;
    if (b.dataset.lh) settings.lh = Number(b.dataset.lh);
    if (b.dataset.ff) settings.ff = b.dataset.ff;
    if (b.dataset.theme) settings.theme = b.dataset.theme;
    saveSettings(); applySettings();
  });

  // 抽屉
  $('#drawerMask').addEventListener('click', closeDrawers);
  $$('[data-close]').forEach(b => b.addEventListener('click', () => document.getElementById(b.dataset.close).classList.remove('open'), { once: true }));
  $$('[data-close]').forEach(b => b.addEventListener('click', () => {
    document.getElementById(b.dataset.close).classList.remove('open');
    $('#drawerMask').classList.remove('open');
  }));
  $('#tasksBtn').addEventListener('click', () => openDrawer('tasksDrawer'));

  // 任务抽屉事件委托
  $('#taskList').addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'cancel') cancelTask(el.dataset.tid);
    if (el.dataset.action === 'rmtask') rmTask(el.dataset.tid);
  });

  // 刷新站点 JS
  $('#refreshJs').addEventListener('click', async (e) => {
    e.target.disabled = true; e.target.textContent = '刷新中…';
    try {
      const r = await fetch(`${API}/api/refresh-js`, { method: 'POST' });
      const d = await r.json();
      if (r.ok) toast('站点 JS 刷新成功', 'ok'); else throw new Error(d.error);
    } catch (err) { toast('刷新失败：' + err.message, 'err'); }
    e.target.disabled = false; e.target.textContent = '刷新站点 JS';
  });

  // 阅读器键盘导航
  document.addEventListener('keydown', e => {
    if (state.view !== 'reader') return;
    const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
    if (typing) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); goChapter(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); goChapter(1); }
    if (e.key === 'Escape') closeDrawers();
  });

  // 热门推荐
  loadHot();

  // 恢复活跃下载任务
  try {
    fetch(`${API}/api/downloads`).then(r => r.json()).then(d => {
      (d.data || []).filter(s => ['running', 'pending'].includes(s.status)).forEach(s => {
        state.tasks.set(s.taskId, s); renderTask(s); if (s.status==='running') connectSSE(s.taskId);
      });
    });
  } catch {}
}

function triggerSearch() {
  const kw = $('#q').value.trim();
  if (kw) doSearch(kw);
}

init();
</script>
</body>
</html>
